services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]  # local only: /ask spends API credit
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
  dashboard:
    build: .
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address=0.0.0.0", "--server.headless=true"]
    ports: ["127.0.0.1:8501:8501"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
