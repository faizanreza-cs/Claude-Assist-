[project]
name = "pharmapulse"
version = "0.1.0"
description = "AI commercial analytics copilot for pharma brands: forecasting, market share, patient persistence, HCP targeting, and an LLM agent that answers business questions with grounded numbers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Faizan Reza" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "duckdb>=1.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "lifelines>=0.29",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anthropic>=0.70",
]

[project.optional-dependencies]
app = ["streamlit>=1.35", "plotly>=5.20"]
openai = ["openai>=1.30"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]

[project.scripts]
pharmapulse = "pharmapulse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pharmapulse"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["N803", "N806"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["pharmapulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# tool descriptions are long prose strings the model reads
"pharmapulse/llm/tools.py" = ["E501"]
"scripts/build_notebooks.py" = ["E501"]
